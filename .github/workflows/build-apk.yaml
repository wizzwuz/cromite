name: Build Cromite APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Android architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x64
      runner:
        description: 'Runner label (ubuntu-24.04 or self-hosted)'
        required: true
        default: 'ubuntu-24.04'
      debug:
        description: 'Debug build? (false = release build)'
        required: true
        default: 'false'
      fast_build:
        description: 'Fast optimized build? (symbol_level=0, chrome_pgo_phase=0)'
        required: true
        default: 'true'
      continue_on_patch_error:
        description: 'Continue build if individual non-critical patch fails'
        required: true
        default: 'true'

permissions:
  contents: read

concurrency:
  group: cromite-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android (${{ inputs.arch || 'arm64' }})
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 360

    steps:
      - name: Reclaim Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo docker system prune -af || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read Cromite & Chromium Version
        id: get_version
        run: |
          VERSION=$(tr -d '[:space:]' < build/RELEASE)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building for Chromium / Cromite version: ${VERSION}"

      - name: Prepare Output Directory
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out_apk"
          chmod -R 777 "${GITHUB_WORKSPACE}/out_apk"

      - name: Build APK in Cromite Container
        env:
          ANDROID_ARCH: ${{ inputs.arch || 'arm64' }}
          TARGET_ISDEBUG: ${{ inputs.debug || 'false' }}
          FAST_BUILD: ${{ inputs.fast_build || 'true' }}
          CONTINUE_ON_PATCH_ERROR: ${{ inputs.continue_on_patch_error || 'true' }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          echo "Pulling Chromium base container: uazo/chromium:${VERSION}"
          docker pull "uazo/chromium:${VERSION}"

          echo "Running build container..."
          docker run --rm             -e ANDROID_ARCH="${ANDROID_ARCH}"             -e TARGET_ISDEBUG="${TARGET_ISDEBUG}"             -e FAST_BUILD="${FAST_BUILD}"             -e CONTINUE_ON_PATCH_ERROR="${CONTINUE_ON_PATCH_ERROR}"             -v "${GITHUB_WORKSPACE}:/home/lg/working_dir/cromite"             -v "${GITHUB_WORKSPACE}/out_apk:/out"             -w /home/lg/working_dir             "uazo/chromium:${VERSION}"             bash /home/lg/working_dir/cromite/build/build_in_docker.sh

      - name: Verify Built APK
        run: |
          echo "Build output directory contents:"
          ls -lh "${GITHUB_WORKSPACE}/out_apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromePublic-${{ inputs.arch || 'arm64' }}-apk
          path: out_apk/*.apk
          if-no-files-found: error
          retention-days: 14
